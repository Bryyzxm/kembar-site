<!doctype html><html><head><meta charset="utf-8"><style>
 body{margin:0;background:#071A24;color:#FCFFFF;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{max-width:1100px;margin:0 auto;padding:44px 28px 60px}
 h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#0593C6;margin:0 0 22px}
 .row{display:flex;align-items:center;gap:20px;padding:18px 0;border-top:1px solid rgba(252,255,255,.1)}
 .tag{width:18px;font-size:12px;color:#0593C6;font-weight:700}
 .box{border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center}
 .box.dark{background:#0d2530} .box.light{background:#fff}
 .sizes{display:flex;gap:16px;align-items:center} .lock{flex:1} .lock img{display:block}
</style></head><body><div class="wrap"><h1>A vs F (16:9, centered)</h1>  <div class="row">
    <div class="tag">A</div>
    <div class="box dark"><img src="variant-a.svg" width="120" height="120" alt=""></div>
    <div class="box light"><img src="variant-a.svg" width="120" height="120" alt=""></div>
    <div class="sizes">
      <img src="variant-a.svg" width="48" height="48" alt="">
      <img src="variant-a.svg" width="32" height="32" alt="">
      <img src="variant-a.svg" width="16" height="16" alt="">
    </div>
    <div class="box dark lock"><img src="lockup-dark-a.svg" height="60" alt="kembar"></div>
  </div>
  <div class="row">
    <div class="tag">F</div>
    <div class="box dark"><img src="variant-f.svg" width="120" height="120" alt=""></div>
    <div class="box light"><img src="variant-f.svg" width="120" height="120" alt=""></div>
    <div class="sizes">
      <img src="variant-f.svg" width="48" height="48" alt="">
      <img src="variant-f.svg" width="32" height="32" alt="">
      <img src="variant-f.svg" width="16" height="16" alt="">
    </div>
    <div class="box dark lock"><img src="lockup-dark-f.svg" height="60" alt="kembar"></div>
  </div>
</div></body></html>
