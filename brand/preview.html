<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kembar — brand sheet</title>
<style>
  :root { --sky: #0593C6; --pink: #D83995; --white: #FCFFFF; --ink: #071A24; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: var(--ink); color: var(--white); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 56px 28px 80px; }
  h1 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--sky); font-weight: 700; margin: 0 0 10px; }
  h2 { font-size: 15px; margin: 0 0 18px; font-weight: 600; color: #cfe3ec; }
  section { border-top: 1px solid rgba(252,255,255,.12); padding: 34px 0 6px; }
  section:first-of-type { border-top: 0; padding-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .box { border-radius: 14px; padding: 26px; display: flex; align-items: center; justify-content: center; }
  .box.dark { background: #0d2530; }
  .box.light { background: #ffffff; }
  .box.sky { background: var(--sky); }
  .box.pink { background: var(--pink); }
  .sizes { display: flex; gap: 24px; align-items: flex-end; }
  .sizes figure { margin: 0; text-align: center; }
  .sizes figcaption { font-size: 11px; color: #7fa9bd; margin-top: 8px; }
  .swatches { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { width: 172px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(252,255,255,.14); }
  .sw .chip { height: 76px; }
  .sw .meta { padding: 12px 14px; font-size: 12.5px; line-height: 1.5; }
  .sw b { display: block; font-size: 13px; }
  .sw code { color: #9dc0d0; font-size: 11.5px; }
  p.note { color: #9dc0d0; font-size: 13.5px; max-width: 62ch; margin: 16px 0 0; }
</style></head>
<body><div class="wrap">
  <section>
    <h1>kembar · brand sheet</h1>
    <h2>Mark</h2>
    <div class="row">
      <div class="box dark"><img src="mark.svg" width="104" height="104" alt=""></div>
      <div class="box light"><img src="mark.svg" width="104" height="104" alt=""></div>
      <div class="box sky"><img src="mark.svg" width="104" height="104" alt=""></div>
      <div class="box pink"><img src="mark.svg" width="104" height="104" alt=""></div>
    </div>
    <p class="note">Dua frame 16:9 dari satu take, yang depan diberi caption. Kembar: dua versi dari rekaman yang sama.</p>
  </section>

  <section>
    <h2>Lockup</h2>
    <div class="row">
      <div class="box dark" style="flex:1;min-width:340px"><img src="lockup-dark.svg" width="244.53" height="64" alt="kembar"></div>
      <div class="box light" style="flex:1;min-width:340px"><img src="lockup-light.svg" width="244.53" height="64" alt="kembar"></div>
    </div>
  </section>

  <section>
    <h2>Ukuran kecil</h2>
    <div class="sizes">
      <figure><img src="mark.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
      <figure><img src="mark.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      <figure><img src="mark.svg" width="24" height="24" alt=""><figcaption>24</figcaption></figure>
      <figure><img src="mark.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>Avatar sosial</h2>
    <div class="row">
      <div class="box dark"><img src="avatar.svg" width="112" height="112" alt=""></div>
      <div class="box dark"><img src="avatar.svg" width="48" height="48" alt=""></div>
    </div>
  </section>

  <section>
    <h2>Palet</h2>
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:#0593C6"></div><div class="meta"><b>Sky Blue</b><code>#0593C6</code></div></div>
      <div class="sw"><div class="chip" style="background:#D83995"></div><div class="meta"><b>Hot Pink</b><code>#D83995</code></div></div>
      <div class="sw"><div class="chip" style="background:#FCFFFF"></div><div class="meta"><b>White</b><code>#FCFFFF</code></div></div>
      <div class="sw"><div class="chip" style="background:#071A24"></div><div class="meta"><b>Ink</b><code>#071A24</code></div></div>
    </div>
  </section>
</div></body></html>
